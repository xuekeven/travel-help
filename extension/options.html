<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Travel Help · 12306 同步助手 · 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      width: 420px;
      background: #f5f5f5;
      color: #333;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1a1a1a;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1677ff; }
    .tip {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
    }
    .divider { height: 1px; background: #e8e8e8; margin: 16px 0; }
    button {
      width: 100%;
      padding: 9px;
      background: #1677ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0958d9; }
    .saved {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      border-radius: 6px;
      font-size: 13px;
      color: #389e0d;
      display: none;
    }
    .test-result {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .test-result.ok { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
    .test-result.err { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
    .btn-test {
      margin-top: 8px;
      background: #fff;
      color: #1677ff;
      border: 1px solid #1677ff;
    }
    .btn-test:hover { background: #e6f4ff; }
  </style>
</head>
<body>
  <h2>🚄 Travel Help · 12306 同步助手 · 设置</h2>

  <div class="field">
    <label>服务器地址</label>
    <input id="serverUrl" type="text" placeholder="http://100.x.x.x:3005" />
    <p class="tip">填写 Tailscale IP，如 http://100.64.0.1:3005</p>
  </div>

  <div class="field">
    <label>同步 Token</label>
    <input id="syncToken" type="password" placeholder="与服务器 EXTENSION_SYNC_TOKEN 一致" />
    <p class="tip">在服务器 .env 文件中查看 EXTENSION_SYNC_TOKEN 的值</p>
  </div>

  <div class="divider"></div>

  <button id="save">保存设置</button>
  <div class="saved" id="savedTip">✓ 设置已保存</div>

  <button class="btn-test" id="testConn">测试连接</button>
  <div class="test-result" id="testResult"></div>

  <script src="options.js"></script>
</body>
</html>
