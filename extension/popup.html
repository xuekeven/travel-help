<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Travel Help · 12306 同步助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 380px;
      padding: 16px;
      background: #fff;
      color: #333;
    }
    h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1a1a1a;
    }
    .enable-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      background: #fafafa;
    }
    .enable-text {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-flex;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input {
      width: 0;
      height: 0;
      opacity: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #d9d9d9;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }
    .switch input:checked + .slider {
      background: #1677ff;
    }
    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1677ff; }
    .tip {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
      line-height: 1.4;
    }
    .divider { height: 1px; background: #e8e8e8; margin: 14px 0; }
    button {
      width: 100%;
      padding: 9px;
      background: #1677ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0958d9; }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn-test {
      margin-top: 8px;
      background: #fff;
      color: #1677ff;
      border: 1px solid #1677ff;
    }
    .btn-test:hover { background: #e6f4ff; }
    .saved {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      border-radius: 6px;
      font-size: 13px;
      color: #389e0d;
      display: none;
    }
    .test-result {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .test-result.ok { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
    .test-result.err { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
  </style>
</head>
<body>
  <h3>🚄 Travel Help · 12306 同步助手</h3>

  <div class="enable-row">
    <span class="enable-text">启用</span>
    <label class="switch" aria-label="启用插件功能">
      <input id="enabled" type="checkbox" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label>服务器地址</label>
    <input id="serverUrl" type="text" placeholder="https://example.com/travel" />
  </div>

  <div class="field">
    <label>同步 Token</label>
    <input id="syncToken" type="password" placeholder="与服务器 EXTENSION_SYNC_TOKEN 一致" />
    <p class="tip">在服务器 .env 文件中查看 EXTENSION_SYNC_TOKEN 的值</p>
  </div>

  <div class="divider"></div>

  <button id="save">保存设置</button>
  <div class="saved" id="savedTip">✓ 设置已保存</div>

  <button class="btn-test" id="testConn">测试连接</button>
  <div class="test-result" id="testResult"></div>

  <script src="popup.js"></script>
</body>
</html>
