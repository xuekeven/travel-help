<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>12306 买票助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      padding: 16px;
      background: #fff;
    }
    h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1a1a1a;
    }
    .status { font-size: 13px; color: #555; margin-bottom: 12px; line-height: 1.6; }
    .status span { color: #1677ff; font-weight: 500; }
    .guide {
      background: #f0f5ff;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .guide ol { padding-left: 16px; }
    a {
      display: block;
      text-align: center;
      padding: 7px;
      background: #1677ff;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }
    a:hover { background: #0958d9; }
  </style>
</head>
<body>
  <h3>🚄 12306 买票助手</h3>

  <div class="status" id="status">加载中...</div>

  <div class="guide">
    <strong>使用方式：</strong>
    <ol>
      <li>在设置中填写服务器地址和 Token</li>
      <li>登录 12306 并打开「候补订单」或「火车票订单-未出行订单」页面</li>
      <li>插件自动同步候补订单和未出行订单到服务器</li>
    </ol>
  </div>

  <a id="openOptions">⚙️ 打开设置</a>

  <script src="popup.js"></script>
</body>
</html>
